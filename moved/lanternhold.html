<script>
/* Lanternhold lives at lanternhold.born2gamellc.com. Players who once played at this old address keep their
   progress: it rides along in the URL hash and the game restores it before it starts. Sign-in tokens never travel. */
(function () {
  var NEW = 'https://lanternhold.born2gamellc.com/';
  var KEYS = ['lanternhold.save.v1', 'lanternhold.epoch', 'lanternhold.muted', 'lanternhold.wiped', 'lh_ref'];
  var o = {};
  try { KEYS.forEach(function (k) { var v = localStorage.getItem(k); if (v != null) o[k] = v; }); } catch (e) {}
  var hash = Object.keys(o).length ? '#lhmove=' + encodeURIComponent(JSON.stringify(o)) : '';
  location.replace(NEW + location.search + hash);
})();
</script>
