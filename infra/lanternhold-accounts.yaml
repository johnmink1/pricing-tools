    UpdateReplacePolicy: Retain
    Properties:
      TableName: lanternhold-heroes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pid
          AttributeType: S
      KeySchema:
        - AttributeName: pid
          KeyType: HASH
      Tags:
        - Key: app
          Value: lanternhold

