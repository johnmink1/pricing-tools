  MailFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: trade-table
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:Query, dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:ConditionCheckItem]
                Resource: !GetAtt TradeTable.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem]
                Resource: !GetAtt HeroesTable.Arn

  MailFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: lanternhold-mail
      Runtime: nodejs22.x
      Handler: index.handler
      MemorySize: 128
      Timeout: 5
      Role: !GetAtt MailFunctionRole.Arn
      Environment:
        Variables:
          TABLE: !Ref TradeTable
          HEROES: !Ref HeroesTable
      Code:
