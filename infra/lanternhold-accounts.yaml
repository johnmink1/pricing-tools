AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Lanternhold player accounts and cloud saves. Serverless and pay-per-use:
  Cognito (email sign-in), an HTTP API, one small Lambda and a DynamoDB table.
  Costs nothing at small scale (Cognito free up to 10,000 monthly players).

Parameters:
  GameOrigin:
    Type: String
    Default: https://tools.born2develop.com
    Description: Website address the game is served from (for CORS).

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: lanternhold-players
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false
      Schema:
        - Name: email
          Required: true
          Mutable: true
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your Lanternhold code
        EmailMessage: 'Your Lanternhold code is {####}. Enter it in the game to finish. If you did not ask for this, you can ignore this email.'
      UserPoolTags:
        app: lanternhold

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: lanternhold-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 365
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  SavesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: lanternhold-saves
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      Tags:
        - Key: app
          Value: lanternhold

  SaveFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: saves-table
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem]
                Resource: !GetAtt SavesTable.Arn

  SaveFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: lanternhold-save
      Runtime: nodejs22.x
      Handler: index.handler
      MemorySize: 128
      Timeout: 5
      Role: !GetAtt SaveFunctionRole.Arn
      Environment:
        Variables:
          TABLE: !Ref SavesTable
      Code:
        ZipFile: |
          const { DynamoDBClient, GetItemCommand, PutItemCommand, DeleteItemCommand } = require('@aws-sdk/client-dynamodb');
          const db = new DynamoDBClient({});
          const TABLE = process.env.TABLE;
          const res = (code, body) => ({ statusCode: code, headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
          exports.handler = async (event) => {
            const sub = event.requestContext && event.requestContext.authorizer && event.requestContext.authorizer.jwt && event.requestContext.authorizer.jwt.claims.sub;
            if (!sub) return res(401, { error: 'not signed in' });
            const method = event.requestContext.http.method;
            const Key = { userId: { S: sub } };
            if (method === 'GET') {
              const r = await db.send(new GetItemCommand({ TableName: TABLE, Key }));
              if (!r.Item) return res(404, { error: 'no save' });
              return res(200, { data: r.Item.data.S, updated: Number(r.Item.updated.N) });
            }
            if (method === 'PUT') {
              let body = event.body || '';
              if (event.isBase64Encoded) body = Buffer.from(body, 'base64').toString('utf8');
              if (body.length > 300000) return res(413, { error: 'save too large' });
              let parsed; try { parsed = JSON.parse(body); } catch (e) { return res(400, { error: 'bad json' }); }
              if (typeof parsed.data !== 'string') return res(400, { error: 'missing data' });
              const now = Date.now();
              await db.send(new PutItemCommand({ TableName: TABLE, Item: { userId: { S: sub }, data: { S: parsed.data }, updated: { N: String(now) }, floor: { N: String(Number(parsed.floor) || 0) } } }));
              return res(200, { ok: true, updated: now });
            }
            if (method === 'DELETE') {
              await db.send(new DeleteItemCommand({ TableName: TABLE, Key }));
              return res(200, { ok: true });
            }
            return res(405, { error: 'method not allowed' });
          };

  HeroesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: lanternhold-heroes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pid
          AttributeType: S
      KeySchema:
        - AttributeName: pid
          KeyType: HASH
      Tags:
        - Key: app
          Value: lanternhold

  HeroFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: heroes-table
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:UpdateItem, dynamodb:Scan]
                Resource: !GetAtt HeroesTable.Arn

  HeroFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: lanternhold-heroes
      Runtime: nodejs22.x
      Handler: index.handler
      MemorySize: 128
      Timeout: 5
      Role: !GetAtt HeroFunctionRole.Arn
      Environment:
        Variables:
          TABLE: !Ref HeroesTable
      Code:
        ZipFile: |
          const { DynamoDBClient, UpdateItemCommand, ScanCommand } = require('@aws-sdk/client-dynamodb');
          const crypto = require('crypto');
          const db = new DynamoDBClient({});
          const T = process.env.TABLE;
          const CLS = ['tank', 'healer', 'rogue', 'mage', 'necro'];
          const SIDES = ['covenant', 'radiant', 'tide', 'mercy', 'unsworn'];
          const BAD = /(fuck|shit|cunt|nigg|fag|rape|nazi|hitler|bitch|whore|dick|cock|puss|slut|porn)/i;
          const res = (c, b) => ({ statusCode: c, headers: { 'content-type': 'application/json' }, body: JSON.stringify(b) });
          const pidOf = sub => crypto.createHash('sha256').update('lh:' + sub).digest('hex').slice(0, 16);
          exports.handler = async (e) => {
            const cl = e.requestContext.authorizer && e.requestContext.authorizer.jwt && e.requestContext.authorizer.jwt.claims;
            if (!cl || !cl.sub) return res(401, { error: 'not signed in' });
            const me = pidOf(cl.sub), rk = e.routeKey;
            let b = {};
            if (e.body) { try { b = JSON.parse(e.isBase64Encoded ? Buffer.from(e.body, 'base64').toString() : e.body); } catch (x) { return res(400, { error: 'bad json' }); } }
            if (rk === 'PUT /hero') {
              const name = String(b.name || '').trim();
              if (!/^[A-Za-z][A-Za-z '\-]{1,15}$/.test(name) || BAD.test(name.replace(/[^a-z]/gi, ''))) return res(400, { error: 'name' });
              if (!CLS.includes(b.cls)) return res(400, { error: 'class' });
              const floor = Math.max(1, Math.min(100000, Math.floor(Number(b.floor) || 1)));
              const level = Math.max(1, Math.min(50 + floor * 8, Math.floor(Number(b.level) || 1)));
              const side = SIDES.includes(b.side) ? b.side : 'unsworn';
              const r = await db.send(new UpdateItemCommand({ TableName: T, Key: { pid: { S: me } },
                UpdateExpression: 'SET #n = :n, cls = :c, lv = :l, fl = :f, sd = :s, seen = :t, recruits = :z',
                ExpressionAttributeNames: { '#n': 'name' },
                ExpressionAttributeValues: { ':n': { S: name }, ':c': { S: b.cls }, ':l': { N: String(level) }, ':f': { N: String(floor) }, ':s': { S: side }, ':t': { N: String(Date.now()) }, ':z': { N: '0' } },
                ReturnValues: 'UPDATED_OLD' }));
              const old = r.Attributes && r.Attributes.recruits;
              return res(200, { ok: true, id: me, recruits: old ? Number(old.N) : 0 });
            }
            if (rk === 'GET /heroes') {
              const r = await db.send(new ScanCommand({ TableName: T, Limit: 300 }));
              const cut = Date.now() - 30 * 864e5;
              let list = (r.Items || []).filter(i => i.pid.S !== me && Number(i.seen.N) > cut)
                .map(i => ({ id: i.pid.S, name: i.name.S, cls: i.cls.S, level: Number(i.lv.N), floor: Number(i.fl.N), side: i.sd ? i.sd.S : 'unsworn' }));
              for (let k = list.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [list[k], list[j]] = [list[j], list[k]]; }
              return res(200, { heroes: list.slice(0, 8) });
            }
            if (rk === 'POST /recruit') {
              const id = String(b.heroId || '');
              if (!/^[0-9a-f]{16}$/.test(id) || id === me) return res(400, { error: 'hero' });
              try {
                await db.send(new UpdateItemCommand({ TableName: T, Key: { pid: { S: id } }, UpdateExpression: 'ADD recruits :one',
                  ConditionExpression: 'attribute_exists(pid)', ExpressionAttributeValues: { ':one': { N: '1' } } }));
              } catch (x) { if (x.name === 'ConditionalCheckFailedException') return res(404, { error: 'no hero' }); throw x; }
              return res(200, { ok: true });
            }
            return res(404, { error: 'not found' });
          };

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: lanternhold-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref GameOrigin
          - http://localhost:8765
        AllowMethods: [GET, PUT, POST, DELETE, OPTIONS]
        AllowHeaders: [authorization, content-type]
        MaxAge: 86400

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: cognito
      AuthorizerType: JWT
      IdentitySource: ['$request.header.Authorization']
      JwtConfiguration:
        Audience: [!Ref UserPoolClient]
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'

  SaveIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SaveFunction.Arn
      PayloadFormatVersion: '2.0'

  GetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /save
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${SaveIntegration}'

  PutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: PUT /save
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${SaveIntegration}'

  DeleteRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: DELETE /save
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${SaveIntegration}'

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SaveFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/save'

  HeroIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt HeroFunction.Arn
      PayloadFormatVersion: '2.0'

  HeroPutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: PUT /hero
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${HeroIntegration}'

  HeroListRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /heroes
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${HeroIntegration}'

  RecruitRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /recruit
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${HeroIntegration}'

  HeroInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref HeroFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/*'

Outputs:
  GameConfig:
    Description: Paste this line into Lanternhold's index.html (or send it to Claude).
    Value: !Sub 'window.LH_CLOUD = { region: "${AWS::Region}", clientId: "${UserPoolClient}", api: "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com" };'
