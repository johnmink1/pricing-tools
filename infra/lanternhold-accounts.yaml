AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Lanternhold player accounts and cloud saves. Serverless and pay-per-use:
  Cognito (email sign-in), an HTTP API, one small Lambda and a DynamoDB table.
  Costs nothing at small scale (Cognito free up to 10,000 monthly players).

Parameters:
  GameOrigin:
    Type: String
    Default: https://tools.born2develop.com
    Description: Website address the game is served from (for CORS).
  GameOrigin2:
    Type: String
    Default: https://lanternhold.born2gamellc.com
    Description: Second address the game is served from (for CORS), used while the game moves domains.

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: lanternhold-players
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false
      Schema:
        - Name: email
          Required: true
          Mutable: true
      # Sign-in codes go out through Amazon SES from born2gamellc.com (approved by John 2026-11-23).
      # The SES identity is verified with DKIM and a bounce.born2gamellc.com MAIL FROM; its policy lets Cognito send.
      EmailConfiguration:
        EmailSendingAccount: DEVELOPER
        SourceArn: !Sub 'arn:aws:ses:us-east-1:${AWS::AccountId}:identity/born2gamellc.com'
        From: 'Lanternhold <no-reply@born2gamellc.com>'
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your Lanternhold code
        EmailMessage: 'Your Lanternhold code is {####}. Enter it in the game to finish. If you asked for more than one code, only the code in the newest email works. If you did not ask for this, you can ignore this email.'
      UserPoolTags:
        app: lanternhold
      LambdaConfig:
        DefineAuthChallenge: !GetAtt AuthChalFunction.Arn
        CreateAuthChallenge: !GetAtt AuthChalFunction.Arn
        VerifyAuthChallengeResponse: !GetAtt AuthChalFunction.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: lanternhold-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_CUSTOM_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 365
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  SavesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: lanternhold-saves
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      Tags:
        - Key: app
          Value: lanternhold

  SaveFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: saves-table
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem]
                Resource: !GetAtt SavesTable.Arn

  SaveFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: lanternhold-save
      Runtime: nodejs22.x
      Handler: index.handler
      MemorySize: 128
      Timeout: 5
      Role: !GetAtt SaveFunctionRole.Arn
      Environment:
        Variables:
          TABLE: !Ref SavesTable
      Code:
        ZipFile: |
          const { DynamoDBClient, GetItemCommand, UpdateItemCommand, DeleteItemCommand } = require('@aws-sdk/client-dynamodb');
          const db = new DynamoDBClient({});
          const TABLE = process.env.TABLE;
          const res = (code, body) => ({ statusCode: code, headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
          exports.handler = async (event) => {
            const sub = event.requestContext && event.requestContext.authorizer && event.requestContext.authorizer.jwt && event.requestContext.authorizer.jwt.claims.sub;
            if (!sub) return res(401, { error: 'not signed in' });
            const method = event.requestContext.http.method;
            const Key = { userId: { S: sub } };
            if (method === 'GET') {
              const r = await db.send(new GetItemCommand({ TableName: TABLE, Key }));
              if (!r.Item) return res(404, { error: 'no save' });
              // rst: an admin reset this player; games created before it start over
              return res(200, { data: r.Item.data.S, updated: Number(r.Item.updated.N), rst: r.Item.rst ? Number(r.Item.rst.N) : 0 });
            }
            if (method === 'PUT') {
              let body = event.body || '';
              if (event.isBase64Encoded) body = Buffer.from(body, 'base64').toString('utf8');
              if (body.length > 300000) return res(413, { error: 'save too large' });
              let parsed; try { parsed = JSON.parse(body); } catch (e) { return res(400, { error: 'bad json' }); }
              if (typeof parsed.data !== 'string') return res(400, { error: 'missing data' });
              const now = Date.now();
              // UpdateItem keeps an admin reset stamp (rst); saves from games created before it are refused
              try {
                await db.send(new UpdateItemCommand({ TableName: TABLE, Key, UpdateExpression: 'SET #d = :d, updated = :u, floor = :f',
                  ConditionExpression: 'attribute_not_exists(rst) OR rst <= :c', ExpressionAttributeNames: { '#d': 'data' },
                  ExpressionAttributeValues: { ':d': { S: parsed.data }, ':u': { N: String(now) }, ':f': { N: String(Number(parsed.floor) || 0) }, ':c': { N: String(Number(parsed.created) || 0) } } }));
              } catch (e) {
                if (e.name !== 'ConditionalCheckFailedException') throw e;
                const r = await db.send(new GetItemCommand({ TableName: TABLE, Key }));
                return res(409, { error: 'reset', rst: Number(r.Item.rst.N) });
              }
              return res(200, { ok: true, updated: now });
            }
            if (method === 'DELETE') {
              await db.send(new DeleteItemCommand({ TableName: TABLE, Key }));
              return res(200, { ok: true });
            }
            return res(405, { error: 'method not allowed' });
          };

  HeroesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: lanternhold-heroes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pid
          AttributeType: S
      KeySchema:
        - AttributeName: pid
          KeyType: HASH
      Tags:
        - Key: app
          Value: lanternhold

  HeroFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: heroes-table
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:UpdateItem, dynamodb:Scan]
                Resource: !GetAtt HeroesTable.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem]
                Resource: !GetAtt ChatTable.Arn

