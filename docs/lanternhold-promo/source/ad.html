<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:CP;font-weight:600;src:url(cp600.woff2)}
@font-face{font-family:CP;font-weight:700;src:url(cp700.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#07090f}
body{font-family:Inter,sans-serif;color:#e8e3d6}
.c{position:relative;overflow:hidden;
 background:
  radial-gradient(ellipse 55% 40% at 50% 30%, rgba(255,170,60,.22), transparent 70%),
  radial-gradient(ellipse 80% 50% at 50% 100%, rgba(120,70,200,.18), transparent 70%),
  linear-gradient(#0b0e16,#06080d);
 display:flex;flex-direction:column;align-items:center;text-align:center}
.c:before{content:"";position:absolute;inset:0;
 background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
 background-size:48px 48px;pointer-events:none}
.kick{font-family:CP;font-weight:700;letter-spacing:.32em;color:#e9b347;text-transform:uppercase}
.title{font-family:CP;font-weight:700;letter-spacing:.06em;line-height:1;
 background:linear-gradient(#ffe7a3,#e9b347 55%,#b07a1f);-webkit-background-clip:text;color:transparent;
 filter:drop-shadow(0 0 18px rgba(233,179,71,.45))}
.sub{font-family:CP;font-weight:600;letter-spacing:.28em;color:#9fb0c8;text-transform:uppercase}
.lead{color:#e8e3d6;font-weight:500;line-height:1.35}
.lead b{color:#ffd77a;font-weight:700}
.heroes{display:flex;align-items:flex-end;justify-content:center}
.heroes figure{display:flex;flex-direction:column;align-items:center}
.heroes img{image-rendering:auto;filter:drop-shadow(0 10px 14px rgba(0,0,0,.6))}
.heroes figcaption{font-family:CP;font-weight:700;letter-spacing:.14em;color:#e9b347;text-transform:uppercase}
.floor{height:2px;background:linear-gradient(90deg,transparent,rgba(233,179,71,.6),transparent)}
.cta{font-family:CP;font-weight:700;color:#1a1206;background:linear-gradient(#ffd77a,#e9a73a);border-radius:999px;
 box-shadow:0 0 40px rgba(233,167,58,.45);letter-spacing:.06em}
.url{font-family:CP;font-weight:600;color:#ffd77a;letter-spacing:.04em}
.free{font-weight:600;color:#9fb0c8;letter-spacing:.02em}
.logo{background:#fff;border-radius:999px;display:flex;align-items:center;justify-content:center}
.chips{display:flex;flex-wrap:wrap;justify-content:center}
.chip{border:1px solid rgba(233,179,71,.35);background:rgba(233,179,71,.08);border-radius:999px;color:#f1e6cc;font-weight:600}
.phone{border-radius:44px;background:#11151f;border:3px solid #2a3142;box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 60px rgba(233,179,71,.15);overflow:hidden}
.phone img{display:block;width:100%}
.monsters{position:absolute;display:flex;align-items:flex-end;gap:10px;opacity:.95}
svg.lantern{filter:drop-shadow(0 0 40px rgba(255,160,50,.7))}
</style></head>
<body>
<div id="root"></div>
<script>
const LANTERN=`<svg class="lantern" viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="br" x1="0" x2="1"><stop offset="0" stop-color="#8a5c17"/><stop offset=".5" stop-color="#f2c86a"/><stop offset="1" stop-color="#8a5c17"/></linearGradient>
<radialGradient id="fl" cx=".5" cy=".65" r=".6"><stop offset="0" stop-color="#fff3c4"/><stop offset=".35" stop-color="#ffb43c"/><stop offset="1" stop-color="#e2501a"/></radialGradient>
<radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="rgba(255,190,80,.55)"/><stop offset="1" stop-color="rgba(255,190,80,0)"/></radialGradient></defs>
<circle cx="60" cy="112" r="58" fill="url(#gl)"/>
<path d="M44 34 Q60 6 76 34" fill="none" stroke="url(#br)" stroke-width="7" stroke-linecap="round"/>
<path d="M30 40 H90 L82 58 H38 Z" fill="url(#br)"/>
<rect x="38" y="58" width="44" height="98" fill="rgba(255,200,110,.10)" stroke="url(#br)" stroke-width="5"/>
<line x1="53" y1="58" x2="53" y2="156" stroke="#9a6a20" stroke-width="2.5" opacity=".8"/>
<line x1="67" y1="58" x2="67" y2="156" stroke="#9a6a20" stroke-width="2.5" opacity=".8"/>
<path d="M60 76 C74 96 72 122 60 128 C48 122 46 96 60 76 Z" fill="url(#fl)"/>
<path d="M60 98 C66 108 65 120 60 123 C55 120 54 108 60 98 Z" fill="#fff6d6" opacity=".9"/>
<path d="M32 156 H88 L94 170 H26 Z" fill="url(#br)"/>
<rect x="34" y="170" width="52" height="6" rx="3" fill="#5a3b0f"/>
</svg>`;
const HEROES=[['img3.png','Tank'],['img4.png','Healer'],['img5.png','Rogue'],['img6.png','Mage'],['img7.png','Necromancer']];
function heroes(h,cap,gap){return `<div class="heroes" style="gap:${gap}px">`+HEROES.map(([s,n])=>`<figure><img src="${s}" style="height:${h}px"><figcaption style="font-size:${cap}px;margin-top:10px">${n}</figcaption></figure>`).join('')+`</div>`}
function logo(w){return `<div class="logo" style="padding:${w*.07}px ${w*.12}px"><img src="logo.png" style="width:${w}px;display:block"></div>`}
const f=new URLSearchParams(location.search).get('f')||'square';
const R=document.getElementById('root');
if(f==='square'){R.innerHTML=`<div class="c" style="width:1080px;height:1080px;padding:56px 60px 0">
 <div style="height:220px;width:132px">${LANTERN}</div>
 <div class="kick" style="font-size:22px;margin-top:6px">Born 2 Game presents</div>
 <div class="title" style="font-size:118px;margin-top:14px">LANTERNHOLD</div>
 <div class="lead" style="font-size:34px;margin-top:22px;max-width:900px">Our own <b>free dungeon crawler</b>.<br>Build a party of five. Hold the light.</div>
 <div style="margin-top:34px">${heroes(176,17,26)}</div>
 <div class="floor" style="width:900px;margin-top:6px"></div>
 <div class="cta" style="font-size:34px;padding:18px 46px;margin-top:34px">PLAY FREE ▸ lanternhold.born2gamellc.com</div>
 <div class="free" style="font-size:20px;margin-top:14px">In your browser on phone or PC · Nothing to download</div>
</div>`}
if(f==='portrait'){R.innerHTML=`<div class="c" style="width:1080px;height:1350px;padding:56px 70px 0">
 <div class="kick" style="font-size:22px">Free to play · Made in Woodbridge</div>
 <div class="title" style="font-size:96px;margin-top:16px">LANTERNHOLD</div>
 <div class="sub" style="font-size:20px;margin-top:14px">An idle dungeon crawler from Born 2 Game</div>
 <div style="display:flex;gap:56px;align-items:center;margin-top:40px;text-align:left">
  <div class="phone" style="width:390px;flex:none"><img src="phone.jpg"></div>
  <div style="display:flex;flex-direction:column;gap:26px;width:470px">
   ${[['⚔️','Pick your hero','Tank, Healer, Rogue, Mage or Necromancer'],
      ['🧭','March into the Deep','Your party fights floor by floor, even while you’re away'],
      ['🤝','Team up with players','Recruit other players’ heroes. Earn gold when they recruit yours'],
      ['🐉','Beat bosses together','Guardians, ambushes and a world boss the whole community fights'],
      ['🎒','Loot and level up','Gear, sets, relics and a skill tree for your hero']]
     .map(([e,t,d])=>`<div style="display:flex;gap:18px;align-items:flex-start"><div style="font-size:40px;line-height:1">${e}</div><div><div style="font-family:CP;font-weight:700;font-size:31px;color:#ffd77a">${t}</div><div style="font-size:22px;color:#c9c2b0;margin-top:4px;line-height:1.35">${d}</div></div></div>`).join('')}
  </div>
 </div>
 <div class="cta" style="font-size:32px;padding:18px 44px;margin-top:40px">PLAY FREE ▸ lanternhold.born2gamellc.com</div>
 <div style="margin-top:26px">${logo(210)}</div>
</div>`}
if(f==='story'){R.innerHTML=`<div class="c" style="width:1080px;height:1920px;padding:170px 70px 0">
 <div style="height:300px;width:180px">${LANTERN}</div>
 <div class="kick" style="font-size:26px;margin-top:10px">Born 2 Game presents</div>
 <div class="title" style="font-size:124px;margin-top:20px">LANTERNHOLD</div>
 <div class="lead" style="font-size:44px;margin-top:40px;max-width:900px">One lantern holds the dark shut.<br><b>Five heroes keep it lit.</b></div>
 <div style="margin-top:80px">${heroes(200,19,22)}</div>
 <div class="floor" style="width:940px;margin-top:6px"></div>
 <div class="lead" style="font-size:38px;margin-top:70px">Free in your browser.<br>Phone or PC. Nothing to download.</div>
 <div class="url" style="font-size:40px;margin-top:40px">lanternhold.born2gamellc.com</div>
 <div class="free" style="font-size:24px;margin-top:220px;opacity:.7">▲ tap the link sticker to play</div>
</div>`}
if(f==='wide'){R.innerHTML=`<div class="c" style="width:1200px;height:630px;flex-direction:row;padding:0 50px;text-align:left;align-items:center;gap:24px">
 <div style="flex:1">
  <div class="kick" style="font-size:18px">Born 2 Game presents</div>
  <div class="title" style="font-size:74px;margin-top:12px">LANTERNHOLD</div>
  <div class="lead" style="font-size:28px;margin-top:18px">A free dungeon crawler.<br>Build a party. <b>Hold the light.</b></div>
  <div class="cta" style="display:inline-block;font-size:26px;padding:14px 34px;margin-top:30px;white-space:nowrap">PLAY FREE ▸</div><div class="url" style="font-size:22px;margin-top:14px">lanternhold.born2gamellc.com</div>
 </div>
 <div style="flex:none">${heroes(118,11,4)}<div class="floor" style="margin-top:4px"></div></div>
</div>`}
</script>
</body></html>
