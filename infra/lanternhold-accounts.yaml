  WardenIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt WardenFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 15000

  WardenInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WardenFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/*'

  WardenWarRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /war
      AuthorizationType: NONE
      Target: !Sub 'integrations/${WardenIntegration}'

  WardenLinksRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /admin/links
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${WardenIntegration}'

  WardenVerifyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /admin/verify
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${WardenIntegration}'

  WardenGrantRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /admin/grant
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${WardenIntegration}'

Outputs:
  GameConfig:
    Description: Paste this line into Lanternhold's index.html (or send it to Claude).
    Value: !Sub 'window.LH_CLOUD = { region: "${AWS::Region}", clientId: "${UserPoolClient}", api: "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com" };'
