  ChatTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: lanternhold-chat
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: app
          Value: lanternhold

  ChatFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: chat-table
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:Query, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt ChatTable.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem]
                Resource: !GetAtt HeroesTable.Arn

  ChatFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: lanternhold-chat
      Runtime: nodejs22.x
      Handler: index.handler
      MemorySize: 128
      Timeout: 5
      Role: !GetAtt ChatFunctionRole.Arn
      Environment:
        Variables:
          TABLE: !Ref ChatTable
          HEROES: !Ref HeroesTable
      # Packaged from infra/chat by `aws cloudformation package` (too big to inline since whispers).
      Code: chat

  TradeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: lanternhold-trade
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: app
          Value: lanternhold

