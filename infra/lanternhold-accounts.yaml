AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Lanternhold player accounts and cloud saves. Serverless and pay-per-use:
  Cognito (email sign-in), an HTTP API, one small Lambda and a DynamoDB table.
  Costs nothing at small scale (Cognito free up to 10,000 monthly players).

Parameters:
  GameOrigin:
    Type: String
    Default: https://tools.born2develop.com
    Description: Website address the game is served from (for CORS).

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: lanternhold-players
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false
      Schema:
        - Name: email
          Required: true
          Mutable: true
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your Lanternhold code
        EmailMessage: 'Your Lanternhold code is {####}. Enter it in the game to finish. If you did not ask for this, you can ignore this email.'
      UserPoolTags:
        app: lanternhold

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: lanternhold-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 365
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  SavesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: lanternhold-saves
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      Tags:
        - Key: app
          Value: lanternhold

  SaveFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: saves-table
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem]
                Resource: !GetAtt SavesTable.Arn

  SaveFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: lanternhold-save
      Runtime: nodejs22.x
      Handler: index.handler
      MemorySize: 128
      Timeout: 5
      Role: !GetAtt SaveFunctionRole.Arn
      Environment:
        Variables:
          TABLE: !Ref SavesTable
      Code:
        ZipFile: |
          const { DynamoDBClient, GetItemCommand, PutItemCommand, DeleteItemCommand } = require('@aws-sdk/client-dynamodb');
          const db = new DynamoDBClient({});
          const TABLE = process.env.TABLE;
          const res = (code, body) => ({ statusCode: code, headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
          exports.handler = async (event) => {
            const sub = event.requestContext && event.requestContext.authorizer && event.requestContext.authorizer.jwt && event.requestContext.authorizer.jwt.claims.sub;
            if (!sub) return res(401, { error: 'not signed in' });
            const method = event.requestContext.http.method;
            const Key = { userId: { S: sub } };
            if (method === 'GET') {
              const r = await db.send(new GetItemCommand({ TableName: TABLE, Key }));
              if (!r.Item) return res(404, { error: 'no save' });
              return res(200, { data: r.Item.data.S, updated: Number(r.Item.updated.N) });
            }
            if (method === 'PUT') {
              let body = event.body || '';
              if (event.isBase64Encoded) body = Buffer.from(body, 'base64').toString('utf8');
              if (body.length > 300000) return res(413, { error: 'save too large' });
              let parsed; try { parsed = JSON.parse(body); } catch (e) { return res(400, { error: 'bad json' }); }
              if (typeof parsed.data !== 'string') return res(400, { error: 'missing data' });
              const now = Date.now();
              await db.send(new PutItemCommand({ TableName: TABLE, Item: { userId: { S: sub }, data: { S: parsed.data }, updated: { N: String(now) }, floor: { N: String(Number(parsed.floor) || 0) } } }));
              return res(200, { ok: true, updated: now });
            }
            if (method === 'DELETE') {
              await db.send(new DeleteItemCommand({ TableName: TABLE, Key }));
              return res(200, { ok: true });
            }
            return res(405, { error: 'method not allowed' });
          };

  HeroesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: lanternhold-heroes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pid
          AttributeType: S
      KeySchema:
        - AttributeName: pid
          KeyType: HASH
      Tags:
        - Key: app
          Value: lanternhold

  HeroFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: heroes-table
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:UpdateItem, dynamodb:Scan]
                Resource: !GetAtt HeroesTable.Arn

  HeroFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: lanternhold-heroes
      Runtime: nodejs22.x
      Handler: index.handler
      MemorySize: 128
      Timeout: 5
      Role: !GetAtt HeroFunctionRole.Arn
      Environment:
        Variables:
          TABLE: !Ref HeroesTable
      Code:
        ZipFile: |
          // built from infra/lambda/heroes.js by infra/build.py
          const{DynamoDBClient:b,UpdateItemCommand:m,ScanCommand:f}=require("@aws-sdk/client-dynamodb"),S=require("crypto"),d=new b({}),l=process.env.TABLE,N=["tank","healer","rogue","mage","necro"],w=["covenant","radiant","tide","mercy","unsworn"],x=/(fuck|shit|cunt|nigg|fag|rape|nazi|hitler|bitch|whore|dick|cock|puss|slut|porn)/i,n=(t,u)=>({statusCode:t,headers:{"content-type":"application/json"},body:JSON.stringify(u)}),y=t=>S.createHash("sha256").update("lh:"+t).digest("hex").slice(0,16);exports.handler=async t=>{const u=t.requestContext.authorizer&&t.requestContext.authorizer.jwt&&t.requestContext.authorizer.jwt.claims;if(!u||!u.sub)return n(401,{error:"not signed in"});const c=y(u.sub),p=t.routeKey;let s={};if(t.body)try{s=JSON.parse(t.isBase64Encoded?Buffer.from(t.body,"base64").toString():t.body)}catch{return n(400,{error:"bad json"})}if(p==="PUT /hero"){const r=String(s.name||"").trim();if(!/^[A-Za-z][A-Za-z '\-]{1,15}$/.test(r)||x.test(r.replace(/[^a-z]/gi,"")))return n(400,{error:"name"});if(!N.includes(s.cls))return n(400,{error:"class"});const a=Math.max(1,Math.min(1e5,Math.floor(Number(s.floor)||1))),o=Math.max(1,Math.min(50+a*8,Math.floor(Number(s.level)||1))),e=w.includes(s.side)?s.side:"unsworn",i=await d.send(new m({TableName:l,Key:{pid:{S:c}},UpdateExpression:"SET #n = :n, cls = :c, lv = :l, fl = :f, sd = :s, seen = :t, recruits = :z",ExpressionAttributeNames:{"#n":"name"},ExpressionAttributeValues:{":n":{S:r},":c":{S:s.cls},":l":{N:String(o)},":f":{N:String(a)},":s":{S:e},":t":{N:String(Date.now())},":z":{N:"0"}},ReturnValues:"UPDATED_OLD"})),h=i.Attributes&&i.Attributes.recruits;return n(200,{ok:!0,id:c,recruits:h?Number(h.N):0})}if(p==="GET /heroes"){const r=await d.send(new f({TableName:l,Limit:300})),a=Date.now()-30*864e5;let o=(r.Items||[]).filter(e=>e.pid.S!==c&&e.name&&e.seen&&Number(e.seen.N)>a).map(e=>({id:e.pid.S,name:e.name.S,cls:e.cls.S,level:Number(e.lv.N),floor:Number(e.fl.N),side:e.sd?e.sd.S:"unsworn",on:Date.now()-Number(e.seen.N)<18e4}));for(let e=o.length-1;e>0;e--){const i=Math.floor(Math.random()*(e+1));[o[e],o[i]]=[o[i],o[e]]}return o.sort((e,i)=>i.on-e.on),n(200,{heroes:o.slice(0,10)})}if(p==="POST /recruit"){const r=String(s.heroId||"");if(!/^[0-9a-f]{16}$/.test(r)||r===c)return n(400,{error:"hero"});try{await d.send(new m({TableName:l,Key:{pid:{S:r}},UpdateExpression:"ADD recruits :one",ConditionExpression:"attribute_exists(pid)",ExpressionAttributeValues:{":one":{N:"1"}}}))}catch(a){if(a.name==="ConditionalCheckFailedException")return n(404,{error:"no hero"});throw a}return await d.send(new m({TableName:l,Key:{pid:{S:r}},UpdateExpression:"ADD pin :me",ExpressionAttributeValues:{":me":{SS:[c]}}})),await d.send(new m({TableName:l,Key:{pid:{S:c}},UpdateExpression:"ADD inv :id",ExpressionAttributeValues:{":id":{SS:[r]}}})),n(200,{ok:!0})}return n(404,{error:"not found"})};

  ChatTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: lanternhold-chat
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: app
          Value: lanternhold

  ChatFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: chat-table
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:Query, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt ChatTable.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem]
                Resource: !GetAtt HeroesTable.Arn

  ChatFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: lanternhold-chat
      Runtime: nodejs22.x
      Handler: index.handler
      MemorySize: 128
      Timeout: 5
      Role: !GetAtt ChatFunctionRole.Arn
      Environment:
        Variables:
          TABLE: !Ref ChatTable
          HEROES: !Ref HeroesTable
      Code:
        ZipFile: |
          // built from infra/lambda/chat.js by infra/build.py
          const m=require("@aws-sdk/client-dynamodb"),g=require("crypto"),d=new m.DynamoDBClient({}),f=process.env.TABLE,x=process.env.HEROES,S=/(fuck|shit|cunt|nigg|fag|rape|nazi|hitler|bitch|whore|dick|cock|puss|slut|porn|retard)/gi,k=/(https?:|www\.|\.(com|net|org|gg|io|ly|xyz)\b|discord)/i,s=(e,i)=>({statusCode:e,headers:{"content-type":"application/json"},body:JSON.stringify(i)}),E=e=>g.createHash("sha256").update("lh:"+e).digest("hex").slice(0,16),r=e=>({S:String(e)}),w=e=>({N:String(e)});async function I(e,i){if(e===i)return!0;const t=await d.send(new m.GetItemCommand({TableName:x,Key:{pid:r(i)},ProjectionExpression:"inv"}));return!!(t.Item&&t.Item.inv&&t.Item.inv.SS.includes(e))}async function y(e,i){const t=i.ch;if(t==="global"||t==="trade")return t;if(t==="party"){const p=/^[0-9a-f]{16}$/.test(i.leader||"")?i.leader:e;return await I(e,p)?"party#"+p:null}return null}exports.handler=async e=>{const i=e.requestContext.authorizer&&e.requestContext.authorizer.jwt&&e.requestContext.authorizer.jwt.claims;if(!i||!i.sub)return s(401,{error:"auth"});const t=E(i.sub),p=e.routeKey,b=e.queryStringParameters||{};let c={};if(e.body)try{c=JSON.parse(e.isBase64Encoded?Buffer.from(e.body,"base64").toString():e.body)}catch{return s(400,{error:"json"})}if(p==="GET /chat"){const n=await y(t,b);if(!n)return s(403,{error:"room"});const o=await d.send(new m.QueryCommand({TableName:f,KeyConditionExpression:"pk = :p AND sk > :s",ExpressionAttributeValues:{":p":r(n),":s":r(b.since||"0")},ScanIndexForward:!1,Limit:60}));return s(200,{me:t,msgs:(o.Items||[]).filter(a=>!a.hid).reverse().map(a=>({id:a.sk.S,from:a.from.S,name:a.name.S,cls:a.cls.S,text:a.text.S}))})}if(p==="POST /chat"){const n=await y(t,c);if(!n)return s(403,{error:"room"});let o=String(c.text||"").replace(/[\u0000-\u001f\u007f​-‏‪-‮]/g,"").replace(/\s+/g," ").trim().slice(0,200);const a=String(c.name||"").trim();if(!o)return s(400,{error:"empty"});if(!/^[A-Za-z][A-Za-z '\-]{1,15}$/.test(a)||S.test(a.replace(/[^a-z]/gi,"")))return s(400,{error:"name"});if(S.lastIndex=0,k.test(o))return s(400,{error:"links"});o=o.replace(S,h=>"*".repeat(h.length));const u=Date.now();try{await d.send(new m.PutItemCommand({TableName:f,Item:{pk:r("rate#"+t),sk:r("0"),t:w(u),ttl:w(Math.floor(u/1e3)+3600)},ConditionExpression:"attribute_not_exists(t) OR t < :c",ExpressionAttributeValues:{":c":w(u-3e3)}}))}catch(h){if(h.name==="ConditionalCheckFailedException")return s(429,{error:"slow"});throw h}const l=u.toString(36).padStart(9,"0")+g.randomBytes(3).toString("hex");return await d.send(new m.PutItemCommand({TableName:f,Item:{pk:r(n),sk:r(l),from:r(t),name:r(a),cls:r(/^(tank|healer|rogue|mage|necro)$/.test(c.cls)?c.cls:"rogue"),text:r(o),ttl:w(Math.floor(u/1e3)+7*86400)}})),s(200,{ok:!0,id:l})}if(p==="POST /report"){const n=await y(t,c);if(!n||!/^[0-9a-z]{15}$/.test(c.id||""))return s(400,{error:"bad"});try{(await d.send(new m.UpdateItemCommand({TableName:f,Key:{pk:r(n),sk:r(c.id)},UpdateExpression:"ADD rep :m",ConditionExpression:"attribute_exists(sk)",ExpressionAttributeValues:{":m":{SS:[t]}},ReturnValues:"ALL_NEW"}))).Attributes.rep.SS.length>=3&&await d.send(new m.UpdateItemCommand({TableName:f,Key:{pk:r(n),sk:r(c.id)},UpdateExpression:"SET hid = :t",ExpressionAttributeValues:{":t":{BOOL:!0}}}))}catch(o){if(o.name!=="ConditionalCheckFailedException")throw o}return s(200,{ok:!0})}if(p==="GET /parties"){const n=await d.send(new m.GetItemCommand({TableName:x,Key:{pid:r(t)},ProjectionExpression:"pin"})),o=(n.Item&&n.Item.pin?n.Item.pin.SS:[]).slice(0,20),a=[];for(const u of o){const l=await d.send(new m.GetItemCommand({TableName:x,Key:{pid:r(u)},ProjectionExpression:"#n",ExpressionAttributeNames:{"#n":"name"}}));l.Item&&l.Item.name&&a.push({leader:u,name:l.Item.name.S})}return s(200,{me:t,parties:a})}return s(404,{error:"route"})};

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: lanternhold-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref GameOrigin
          - http://localhost:8765
        AllowMethods: [GET, PUT, POST, DELETE, OPTIONS]
        AllowHeaders: [authorization, content-type]
        MaxAge: 86400

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: cognito
      AuthorizerType: JWT
      IdentitySource: ['$request.header.Authorization']
      JwtConfiguration:
        Audience: [!Ref UserPoolClient]
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'

  SaveIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SaveFunction.Arn
      PayloadFormatVersion: '2.0'

  GetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /save
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${SaveIntegration}'

  PutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: PUT /save
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${SaveIntegration}'

  DeleteRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: DELETE /save
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${SaveIntegration}'

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SaveFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/save'

  HeroIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt HeroFunction.Arn
      PayloadFormatVersion: '2.0'

  HeroPutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: PUT /hero
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${HeroIntegration}'

  HeroListRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /heroes
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${HeroIntegration}'

  RecruitRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /recruit
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${HeroIntegration}'

  HeroInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref HeroFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/*'

  ChatIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ChatFunction.Arn
      PayloadFormatVersion: '2.0'

  ChatGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /chat
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ChatIntegration}'

  ChatPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /chat
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ChatIntegration}'

  ChatReportRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /report
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ChatIntegration}'

  ChatPartiesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /parties
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ChatIntegration}'

  ChatInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ChatFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/*'

Outputs:
  GameConfig:
    Description: Paste this line into Lanternhold's index.html (or send it to Claude).
    Value: !Sub 'window.LH_CLOUD = { region: "${AWS::Region}", clientId: "${UserPoolClient}", api: "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com" };'
